deploy-prod:
  <<: *default-prod
  stage: deploy
  environment:
    name: production
  script:
    - echo "BISMILLAHIROHMANIROHIM"
    - echo "Suro diro joyo diningrat, lebur dening pangastuti."
    - echo "Brokohan kakang kawah Adi Ari-adi, Mugi-mugi Gusti pinaring kalancaran, tebih saking error 500, cinaketaken kaliyan status ijo mbranang puniko."

    - |
      sudo -u wajira-team bash << 'EOF'
      set -e

      echo "REKSO BUMI MINONGKO PIPELINE!"
      
      echo "Bismillah, cekelanku!"
      
      cd /home/wajira-team/production/finance-dash
      git pull origin master
      
      if docker ps -a --format '{{.Names}}' | grep -Eq "^wajira-finance-dashboard$"; then
        echo "Stopping and removing existing container..."
        docker container stop wajira-finance-dashboard || true
        docker container rm wajira-finance-dashboard || true
        docker rmi wajira-finance-dashboard:latest || true
      fi
      
      docker compose -f docker-compose.prod.yaml build --no-cache
      docker compose -f docker-compose.prod.yaml up -d
      docker compose -f docker-compose.prod.yaml restart || true
      
      sleep 5

      EOF
  before_script:
    - echo "Niat ingsun ngresiki bug, masang kode ingkang pener minulya manuungsa..."
  after_script:
    - echo "Gusti Pinaringan, pipeline ijo mbranang, sukses rahayu, rahayu wilujeng!"